[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "frgfp"
dynamic = ["version"]
description = "Functional Renormalization Group Fixed Point solver"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0", "numba>=0.55.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "sphinx",
    "pydata-sphinx-theme",
    "numpydoc"
]

[tool.scikit-build]
cmake.version = ">=3.15"
wheel.packages = ["frgfp"]
cmake.build-type = "Release"
build-dir = "build"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]