[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "frgfp"
version = "0.1.0"
description = "Functional Renormalization Group Fixed Point solver"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0", "numba>=0.55.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0"
]

[tool.scikit-build]
cmake.version = ">=3.15"
wheel.packages = ["frgfp"]
cmake.build-type = "Release"
build-dir = "build"