name: Wheel debug (single target)

# Manual, single-cell build+test used while iterating on the wheel pipeline.  It
# is deliberately separate from ci.yml so that a debug run never posts the
# required `ci` status check on a pull request, and it reuses the same
# configuration from pyproject.toml, so what you debug is what CI builds.
#
# Examples:
#   os: macos-latest     archs: arm64    python: 310   -> the macOS delocate path
#   os: macos-26-intel   archs: x86_64   python: 312
#   os: ubuntu-24.04     archs: x86_64   python: 314
#   os: windows-2022     archs: AMD64    python: 310
on:
  workflow_dispatch:
    inputs:
      os:
        description: "Runner label"
        required: true
        default: "macos-latest"
      archs:
        description: "CIBW_ARCHS for that runner (arm64, x86_64, AMD64, aarch64)"
        required: true
        default: "arm64"
      python:
        description: "CPython to build/test (310, 311, 312, 313, 314)"
        required: true
        default: "312"

permissions:
  contents: read

env:
  CIBW_CACHE_PATH: ${{ github.workspace }}/.cibuildwheel-cache

jobs:
  wheel:
    name: wheel · ${{ inputs.os }} · cp${{ inputs.python }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache cibuildwheel's tool downloads
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CIBW_CACHE_PATH }}
            ~/frgfp-libomp
            ~/frgfp-libomp-tarball
          key: cibw-debug-${{ inputs.os }}-${{ hashFiles('pyproject.toml', 'tools/ci/build_libomp.sh') }}

      - name: Prepare the macOS OpenMP runtime
        if: runner.os == 'macOS'
        shell: bash
        # The build links the libomp that before-all compiled for the wheel's
        # deployment target and delocate bundles it into the wheel; the Homebrew
        # keg is installed only as the fallback for the build (CMakeLists.txt).
        #
        # The tests must never load a *second* OpenMP runtime: the extension
        # loads the bundled one, and if numba's omp layer additionally dlopens
        # Homebrew's copy, the OpenMP runtime aborts the whole process ("OMP:
        # Error #15 ... already initialized", which the runner reports as exit
        # code -6).  Pinning numba to its dependency-free workqueue layer keeps
        # exactly one runtime in the process; frgfp/lpa/_solver.py honours an
        # explicit NUMBA_THREADING_LAYER.
        run: |
          brew list libomp >/dev/null 2>&1 || brew install libomp
          echo "NUMBA_THREADING_LAYER=workqueue" >> "$GITHUB_ENV"

      - name: Build the wheel and run pytest
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: cp${{ inputs.python }}-*
          CIBW_ARCHS: ${{ inputs.archs }}
          # macOS only: report a failing test run as a GitHub annotation.
          # Annotations are readable without repository admin rights, so the real
          # error is visible on the pull request rather than only in the
          # (admin-only) job log.
          CIBW_TEST_COMMAND_MACOS: >-
            log=$(mktemp); python -m pytest --pyargs frgfp -m "not benchmark" -q >"$log" 2>&1
            || { cat "$log"; echo "::error::pytest failed: $(tail -n 5 "$log" | tr '\n' ' ')"; exit 1; };
            cat "$log"

      - name: Upload the wheel
        uses: actions/upload-artifact@v7
        with:
          name: debug-wheel-${{ inputs.os }}-cp${{ inputs.python }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error
